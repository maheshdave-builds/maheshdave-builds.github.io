<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>
  <script>
    (function () {
      var path = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace('/?/' + path.replace(/^\/+/, ''));
    })();
  </script>
</head>
<body></body>
</html>
