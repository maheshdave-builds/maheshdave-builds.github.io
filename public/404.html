<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening page…</title>
    <script>
      // GitHub Pages has no configurable SPA rewrites. Send unknown routes
      // back to index.html while preserving the original path, query and hash.
      (function () {
        var original = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace('/?/' + encodeURIComponent(original));
      })();
    </script>
  </head>
  <body><p>Opening page…</p></body>
</html>
