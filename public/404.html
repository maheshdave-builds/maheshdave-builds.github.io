<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages serves this file for unknown paths. Rewrite the requested
      // path into a query string so index.html can restore it and let the
      // client router resolve /blog/:slug and /mdadmin/* on a hard refresh.
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace('/?/' + path.replace(/^\/+/, ''));
      })();
    </script>
    <meta name="robots" content="noindex" />
  </head>
  <body></body>
</html>
